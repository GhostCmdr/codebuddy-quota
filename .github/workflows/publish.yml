name: publish

on:
  push:
    tags:
      - 'v*'

# contents: write 给「挂到 GitHub Release」那步上传 .vsix 用；VSCE_PAT / OVSX_PAT 走 secret，与本权限无关。
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 与本地开发一致。测试脚本里的 "test/**/*.test.js" 由 Node 自己展开，
          # glob 支持要 Node 21+，用 20 会当成模块路径去找 → 整步直接报错
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 校验 tag 与 package.json 版本一致
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag 是 v$tag，package.json 是 $version，不一致，拒绝发布。" >&2
            exit 1
          fi
          # lockfile 顶层 version 失配 npm ci 不会报错，所以升版时容易漏掉它，
          # 一漏就连着几个版本没人发现。
          lock="$(node -p "require('./package-lock.json').version")"
          if [ "$lock" != "$version" ]; then
            echo "package-lock.json 还是 $lock，package.json 是 $version。本地跑一次 npm install 对齐后再提交。" >&2
            exit 1
          fi

      - name: 单元测试
        # 布局/像素校验（preview/measure-*.js）断言的是 Segoe UI + Microsoft YaHei
        # 下的墨迹间距，CI 机器没这两款字体，量出来必然不同——那是本机设计常量的
        # 回归门，留在提交前本地跑 npm test。test:unit 会先自动编译出 out/。
        run: npm run test:unit

      - name: 打包
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: 挂到 GitHub Release
        # 放在发市场之前：国产 IDE（Qoder CN / Trae CN / CodeArts / CodeBuddy）的扩展面板
        # 走各自的市场源，未必搜得到微软 Marketplace，这个 .vsix 附件就是给那部分用户的
        # 兜底下载口，不该被后面市场的发布失败连带跳过。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes="$(awk -v h="## ${version}" 'index($0,h)==1{c=1;next} c&&/^## /{c=0} c' CHANGELOG.md)"
          # CHANGELOG 只记功能改动，所以没有小节是正常情况，不是错误
          [ -n "$notes" ] || notes="本版无功能变更。"
          # 已存在就顺手把正文同步过去：改了 CHANGELOG 再重推同一个 tag 就能刷新生成稿
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$notes"
          fi
          # --clobber：重复推同一个 tag 时覆盖同名附件，不报错
          gh release upload "$tag" ./*.vsix --clobber

      - name: 发布到 Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          version="$(node -p "require('./package.json').version")"
          id="$(node -p "const p=require('./package.json');p.publisher+'.'+p.name")"
          published="$(npx --yes @vscode/vsce show "$id" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s.slice(s.indexOf("{"))).versions[0].version)}catch{console.log("")}})')"
          if [ "$published" = "$version" ]; then
            echo "v$version 已在市场上（重复推 tag），跳过发布。"
            exit 0
          fi
          npx --yes @vscode/vsce publish --no-dependencies --pat "$VSCE_PAT"

      - name: 发布到 Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$(ls ./*.vsix | head -n1)"
          version="$(node -p "require('./package.json').version")"
          ns="$(node -p "require('./package.json').publisher")"
          name="$(node -p "require('./package.json').name")"
          # 重复推同一个 tag 时该版本已存在，先查再决定，跳过即可（与 Marketplace 那步同一套写法）。
          # 这里不用 `|| echo` 兜底：那会把发布失败伪装成绿灯。
          if curl -sf -o /dev/null "https://open-vsx.org/api/$ns/$name/$version"; then
            echo "v$version 已在 Open VSX 上（重复推 tag），跳过发布。"
            exit 0
          fi
          # 实测：ovsx 在**空令牌**下不会报错——verify-pat 会打印「PAT valid」并返回 0，
          # 于是 publish 也静默成功、什么都没发出去（首次发布就是这么假绿了一次）。
          # 所以真要发布之前自己拦一道：secret 没配或值为空直接红。
          # 位置放在「已存在则跳过」之后：版本已在 Open VSX 上时不该因为 secret 缺失而误红。
          if [ -z "$OVSX_PAT" ]; then
            echo "secret OVSX_PAT 缺失或为空：拒绝继续（空令牌下 ovsx 会假成功）" >&2
            exit 1
          fi
          # 用长期令牌发布。open-vsx.org 的「可信发布（OIDC）」登记是绑到**已存在的扩展**上的：
          # 首发时这个扩展还没出现在 Open VSX 上、选不到它（其页面原话「扩展只能有一个」），
          # 所以第一次发布走 OVSX_PAT；等扩展上线后想换成受信发布再回来登记。
          npx --yes ovsx publish "$vsix" -p "$OVSX_PAT"
